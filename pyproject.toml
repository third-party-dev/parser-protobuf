[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-pparse"
description = "Partial Parsing"

# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "protobuf",
]

# Requires PEP 621 (setuptools>=61)
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}


[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"thirdparty_pparse" = [
    "data/proto/*.pb",
    "data/proto/*.proto",
    "data/proto/*.proto3",
    "data/fbs/tflite/*.fbs",
    "data/fbs/tflite/*.json",
    "data/fbs/mnn/*.fbs",
    "data/fbs/mnn/*.json",
]

[tool.ruff]
exclude = [
    "docs",
    "outputs",
    "scripts",
    "tests",
    "src/thirdparty/pparse/data",
    "src/thirdparty/pparse/external",
    #"src/thirdparty/pparse/ident",
    #"src/thirdparty/pparse/cli",
    #"src/thirdparty/pparse/view",
    #"src/thirdparty/pparse/lazy",
    #"src/thirdparty/pparse/lib",
    #"src/thirdparty/pparse/_httpdata.py",
    #"src/thirdparty/pparse/_xml.py",
    #src/thirdparty/pparse/dump.py",
    #"src/thirdparty/pparse/utils.py",
]
line-length = 120

[tool.ruff.format]
exclude = [
    "docs",
    "outputs",
    "scripts",
    "tests",
    "src/thirdparty/pparse/data",
    "src/thirdparty/pparse/external",
    "src/thirdparty/pparse/ident/**",
]
quote-style = "preserve"

[tool.ruff.lint]
# E402 - Removing rule defers imports not needed for arg parsing.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"src/thirdparty/pparse/lib/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
exclude = [
    "^docs/",
    "^outputs/",
    "^scripts/",
    "^tests/",
    "src/thirdparty/pparse/data/",
    "src/thirdparty/pparse/external/",
    "src/thirdparty/pparse/ident/",
    "src/thirdparty/pparse/cli/",
    "src/thirdparty/pparse/view/",
    "src/thirdparty/pparse/lazy/",
    "src/thirdparty/pparse/_httpdata\\.py$",
    "src/thirdparty/pparse/_xml\\.py$",
    "src/thirdparty/pparse/dump\\.py$",
    "src/thirdparty/pparse/utils\\.py$",
]

[project.scripts]
pparse = "thirdparty.pparse.cli:main"

[project.entry-points."yannt_command"]
# Register pparse as a yannt subcommand
pparse = "thirdparty.pparse.cli.yannt_plugin:register_pparse"

[project.entry-points."pparse_command"]

# Register flatbuffers as a pparse subcommand
flatbuffers = "thirdparty.pparse.cli.pparse_flatbuffers:register_pparse_flatbuffers"

# Register ident as a pparse subcommand
ident = "thirdparty.pparse.cli.pparse_ident:register_pparse_ident"

# Register json as a pparse subcommand
json = "thirdparty.pparse.cli.pparse_json:register_pparse_json"

# Register mnn as a pparse subcommand
mnn = "thirdparty.pparse.cli.pparse_mnn:register_pparse_mnn"

# Register om as a pparse subcommand
om = "thirdparty.pparse.cli.pparse_om:register_pparse_om"

# Register onnx as a pparse subcommand
onnx = "thirdparty.pparse.cli.pparse_onnx:register_pparse_onnx"

# Register pickle as a pparse subcommand
pickle = "thirdparty.pparse.cli.pparse_pickle:register_pparse_pickle"

# Register protobuf as a pparse subcommand
protobuf = "thirdparty.pparse.cli.pparse_protobuf:register_pparse_protobuf"

# Register pytorch as a pparse subcommand
pytorch = "thirdparty.pparse.cli.pparse_pytorch:register_pparse_pytorch"

# Register safetensors as a pparse subcommand
safetensors = "thirdparty.pparse.cli.pparse_safetensors:register_pparse_safetensors"

# Register tflite as a pparse subcommand
tflite = "thirdparty.pparse.cli.pparse_tflite:register_pparse_tflite"

# Register xml as a pparse subcommand
xml = "thirdparty.pparse.cli.pparse_xml:register_pparse_xml"

# Register zip as a pparse subcommand
zip = "thirdparty.pparse.cli.pparse_zip:register_pparse_zip"

